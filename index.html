<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>適時開示通知</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="開示通知">
<meta name="theme-color" content="#0f2440">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f3f5f8; --card: #ffffff; --text: #18202b; --sub: #667085; --line: #e3e7ee;
    --accent: #1f5fbf; --accent-soft: #e6eefb; --danger: #c43d3d; --ok: #1f8a4c;
    --head: #0f2440; --head-text: #ffffff; --input: #f7f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --sub: #8b949e; --line: #2a313b;
      --accent: #5b9bff; --accent-soft: #1b2a42; --danger: #ff6b6b; --ok: #3fb96f;
      --head: #0b1a2f; --head-text: #e6edf3; --input: #0f141a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--head); color: var(--head-text);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  header button { background: transparent; border: 1px solid rgba(255,255,255,.35); color: inherit;
    border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  main { padding: 12px 16px calc(env(safe-area-inset-bottom) + 96px); max-width: 640px; margin: 0 auto; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; background: none; border: 0; padding: 10px 0 8px; color: var(--sub); font-size: 11px; }
  nav button svg { display: block; margin: 0 auto 3px; width: 24px; height: 24px; }
  nav button.on { color: var(--accent); font-weight: 700; }
  .tab { display: none; } .tab.on { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .meta { font-size: 12px; color: var(--sub); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .code { font-weight: 700; color: var(--text); }
  .ttl { font-size: 15px; line-height: 1.5; margin: 6px 0; }
  .chip { display: inline-block; font-size: 11px; background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; padding: 2px 8px; }
  a.card { display: block; color: inherit; text-decoration: none; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; font-size: 14px; line-height: 1.7; }
  label.f { display: block; font-size: 12px; color: var(--sub); margin: 8px 0 4px; }
  input[type=text], input[type=url], input[type=password] { width: 100%; font-size: 16px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--input); color: var(--text); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .grow { flex: 1; min-width: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px;
    padding: 12px 16px; font-size: 15px; font-weight: 600; background: var(--accent); color: #fff; width: 100%; margin-top: 10px; }
  .btn.sub { background: var(--accent-soft); color: var(--accent); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); width: auto; padding: 8px 12px; font-size: 13px; margin: 0; }
  .btn:disabled { opacity: .5; }
  .sw { position: relative; width: 50px; height: 30px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: var(--line); border-radius: 30px; transition: .2s; }
  .sw span::before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff;
    border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .sw input:checked + span { background: var(--ok); }
  .sw input:checked + span::before { transform: translateX(20px); }
  .kw-head { font-weight: 700; font-size: 15px; }
  .hint { font-size: 12px; color: var(--sub); line-height: 1.6; }
  .sticky-save { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 58px); padding: 0 16px; z-index: 4; display: none; }
  .sticky-save.show { display: block; }
  .sticky-save .btn { max-width: 608px; margin: 0 auto; display: flex; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  .status { font-size: 13px; padding: 8px 10px; border-radius: 8px; margin-top: 10px; display: none; line-height: 1.5; }
  .status.show { display: block; }
  .status.ok { background: rgba(31,138,76,.12); color: var(--ok); }
  .status.ng { background: rgba(196,61,61,.12); color: var(--danger); }
  .sec { font-size: 13px; color: var(--sub); margin: 18px 4px 8px; font-weight: 600; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 130px);
    background: rgba(20,26,35,.92); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; max-width: 90%; text-align: center; }
  #toast.show { opacity: 1; }
  .seg { display: flex; background: var(--line); border-radius: 10px; padding: 3px; margin: 4px 0 12px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 0; border-radius: 8px; font-size: 14px; color: var(--sub); }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .pc { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sub); flex: none; }
  .dot.on { background: var(--ok); }
  .w-sum { cursor: pointer; }
  .w-sum .cond { font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.5; }
  .w-body { display: none; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 4px; }
  .card.open .w-body { display: block; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .grp { font-size: 12px; font-weight: 700; color: var(--text); margin: 12px 0 0; }
  .kind { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; color: #fff; background: var(--sub); }
  .kind.up { background: #d0453b; } .kind.down { background: #1f6fd1; }
  .chg.up { color: #d0453b; font-weight: 700; } .chg.down { color: #1f6fd1; font-weight: 700; }
  input.off { opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>適時開示通知</h1>
  <button id="reload" type="button">更新</button>
</header>

<main>
  <section class="tab on" id="tab-history">
    <div id="historyList"><div class="empty">読み込み中…</div></div>
  </section>

  <section class="tab" id="tab-stocks">
    <div class="card pc"><span class="dot" id="pcDot"></span><span id="pcText">PC監視：未接続</span></div>
    <div class="seg" id="seg">
      <button type="button" class="on" data-seg="alerts">通知履歴</button>
      <button type="button" data-seg="watch">銘柄設定</button>
    </div>
    <div id="seg-alerts"><div id="priceList"></div></div>
    <div id="seg-watch" hidden>
      <p class="hint">銘柄をタップして条件を設定します。<b>入力した条件のどれか1つでも満たすと通知</b>し、空欄の条件は使いません。<br>
      前日比と価格は1日1回、短時間の変動は30分おきに再通知します。</p>
      <div id="watchList"></div>
      <button class="btn sub" id="addWatch" type="button">＋ 銘柄を追加</button>
    </div>
  </section>

  <section class="tab" id="tab-keywords">
    <p class="hint">スペース区切り＝すべて含む、「|」区切り＝どれか含む。<br>例：「株主優待 新設」「株式 売出|売り出」</p>
    <div id="kwList"></div>
    <button class="btn sub" id="addKw" type="button">＋ キーワードを追加</button>
  </section>

  <section class="tab" id="tab-settings">
    <div class="sec">通知</div>
    <div class="card">
      <div class="row"><div class="grow">監視（5分おきにチェック）</div>
        <label class="sw"><input type="checkbox" id="setEnabled"><span></span></label></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">メールにも通知する</div>
        <label class="sw"><input type="checkbox" id="setMail"><span></span></label></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">この iPhone へのプッシュ通知</div><div class="hint" id="pushState"></div></div>
      <button class="btn" id="enablePush" type="button">通知をONにする</button>
      <button class="btn sub" id="testPush" type="button">テスト通知を送る</button>
      <div class="status" id="pushStatus"></div>
    </div>

    <div class="sec">接続先（Apps Script）</div>
    <div class="card">
      <label class="f" for="gasUrl">ウェブアプリのURL</label>
      <input type="url" id="gasUrl" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off">
      <label class="f" for="appKey">アプリ用キー</label>
      <input type="password" id="appKey" placeholder="setup実行時にログに出たキー" autocapitalize="off" autocorrect="off">
      <button class="btn" id="saveConn" type="button">保存して接続</button>
      <div class="status" id="connStatus"></div>
    </div>
  </section>
</main>

<div class="sticky-save" id="saveBar"><button class="btn" id="saveKw" type="button">キーワードを保存</button></div>
<div class="sticky-save" id="saveBarW"><button class="btn" id="saveWatch" type="button">銘柄設定を保存</button></div>

<nav>
  <button type="button" class="on" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>開示</button>
  <button type="button" data-tab="stocks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg>株価</button>
  <button type="button" data-tab="keywords">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>キーワード</button>
  <button type="button" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>設定</button>
</nav>

<div id="toast"></div>

<script src="config.js"></script>
<script type="module">
/* Firebaseは通知ONのときだけ読み込む（読み込めなくても一覧・キーワードは使える） */
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
let fbMod = null;
async function loadFirebase() {
  if (fbMod) return fbMod;
  const [app, msg] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-messaging.js')]);
  fbMod = { initializeApp: app.initializeApp, getMessaging: msg.getMessaging, getToken: msg.getToken,
            onMessage: msg.onMessage, isSupported: msg.isSupported };
  return fbMod;
}
window.addEventListener('unhandledrejection', e => {
  const el = document.getElementById('historyList');
  if (el && /読み込み中/.test(el.textContent)) el.innerHTML = '<div class="empty">エラー：' + String(e.reason && e.reason.message || e.reason) + '</div>';
});

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let state = { keywords: [], history: [], settings: {}, push: {} };
let kwDirty = false;
let watchDirty = false;
let seg = 'alerts';
function updateBars() {
  const t = currentTab();
  $('saveBar').classList.toggle('show', t === 'keywords' && kwDirty);
  $('saveBarW').classList.toggle('show', t === 'stocks' && seg === 'watch' && watchDirty);
}

/* ---------- 共通 ---------- */
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function status(el, msg, ok) {
  el.textContent = msg; el.className = 'status show ' + (ok ? 'ok' : 'ng');
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function isStandalone() {
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}

async function api(action, extra = {}) {
  const url = store.get('gasUrl'), key = store.get('appKey');
  if (!url || !key) throw new Error('設定タブで接続先を入力してください');
  let res;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    if (action === 'data') {
      res = await fetch(url + '?action=data&key=' + encodeURIComponent(key) + '&t=' + Date.now(), { signal: ctrl.signal, cache: 'no-store' });
    } else {
      res = await fetch(url, { method: 'POST', body: JSON.stringify(Object.assign({ action, key }, extra)), signal: ctrl.signal });
    }
  } catch (e) {
    throw new Error(e.name === 'AbortError'
      ? 'Apps Scriptからの応答が30秒ありません。「更新」を押すか、少し待ってから開き直してください'
      : '通信できませんでした（電波状況、またはURLを確認してください）');
  } finally { clearTimeout(timer); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Apps Scriptから正しい応答がありません（URLとデプロイ設定を確認）'); }
  if (!j.ok) throw new Error(j.error || 'エラーが発生しました');
  return j;
}

/* ---------- タブ ---------- */
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.id === 'tab-' + b.dataset.tab));
  updateBars();
  window.scrollTo(0, 0);
}));
function currentTab() { return document.querySelector('nav button.on').dataset.tab; }

/* ---------- 読み込み ---------- */
async function load() {
  if ($('historyList').querySelector('.empty') || !$('historyList').children.length)
    $('historyList').innerHTML = '<div class="empty">読み込み中…</div>';
  if (!store.get('gasUrl') || !store.get('appKey')) {
    $('historyList').innerHTML = '<div class="empty">はじめに「設定」タブで<br>接続先を入力してください</div>';
    document.querySelector('nav button[data-tab="settings"]').click();
    return;
  }
  try {
    const j = await api('data');
    state = j.data;
    if (!kwDirty) renderKeywords();
    if (!watchDirty) renderWatch();
    renderHistory();
    renderPrice();
    renderPc();
    renderSettings();
  } catch (e) {
    $('historyList').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

/* ---------- 通知履歴 ---------- */
function renderHistory() {
  const list = state.history || [];
  if (!list.length) {
    $('historyList').innerHTML = '<div class="empty">まだ通知はありません<br>キーワードに該当する開示が出ると、ここに並びます</div>';
    return;
  }
  $('historyList').innerHTML = list.map(h => {
    const inner = `
      <div class="meta"><span class="code">${esc(h.code)}</span><span>${esc(h.name)}</span><span>${esc(h.date)} ${esc(h.time)}</span></div>
      <div class="ttl">${esc(h.title)}</div>
      <div>${String(h.matched || '').split(' / ').filter(Boolean).map(m => `<span class="chip">${esc(m)}</span>`).join(' ')}</div>`;
    return /^https:\/\//.test(h.pdf)
      ? `<a class="card" href="${esc(h.pdf)}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="card">${inner}</div>`;
  }).join('');
}

/* ---------- キーワード ---------- */
function renderKeywords() {
  const list = state.keywords || [];
  if (!list.length) {
    $('kwList').innerHTML = '<div class="empty">キーワードがありません</div>';
    return;
  }
  $('kwList').innerHTML = list.map((k, i) => `
    <div class="card" data-i="${i}">
      <div class="row">
        <div class="grow kw-head">${esc(k.keyword) || '（新しいキーワード）'}</div>
        <label class="sw"><input type="checkbox" data-f="enabled" ${k.enabled ? 'checked' : ''}><span></span></label>
      </div>
      <label class="f">キーワード</label>
      <input type="text" data-f="keyword" value="${esc(k.keyword)}" placeholder="例：株主優待 新設">
      <label class="f">除外キーワード（どれか含めば通知しない）</label>
      <input type="text" data-f="exclude" value="${esc(k.exclude)}" placeholder="例：訂正 延期">
      <label class="f">メモ</label>
      <input type="text" data-f="memo" value="${esc(k.memo)}">
      <div class="row" style="justify-content:flex-end;margin-top:10px">
        <button class="btn danger" type="button" data-del="${i}">削除</button>
      </div>
    </div>`).join('');
}
function markDirty() {
  kwDirty = true;
  updateBars();
}
$('kwList').addEventListener('input', e => {
  const card = e.target.closest('.card'); const f = e.target.dataset.f;
  if (!card || !f) return;
  const k = state.keywords[+card.dataset.i];
  k[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (f === 'keyword') card.querySelector('.kw-head').textContent = k.keyword || '（新しいキーワード）';
  markDirty();
});
$('kwList').addEventListener('click', e => {
  const d = e.target.closest('[data-del]');
  if (!d) return;
  const k = state.keywords[+d.dataset.del];
  if (!confirm('「' + (k.keyword || '新しいキーワード') + '」を削除しますか？')) return;
  state.keywords.splice(+d.dataset.del, 1);
  renderKeywords(); markDirty();
});
$('addKw').addEventListener('click', () => {
  state.keywords = state.keywords || [];
  state.keywords.push({ enabled: true, keyword: '', exclude: '', memo: '' });
  renderKeywords(); markDirty();
  const inputs = $('kwList').querySelectorAll('input[data-f="keyword"]');
  inputs[inputs.length - 1].focus();
});
$('saveKw').addEventListener('click', async () => {
  const btn = $('saveKw'); btn.disabled = true; btn.textContent = '保存中…';
  try {
    const j = await api('saveKeywords', { keywords: state.keywords });
    state = j.data; kwDirty = false;
    renderKeywords(); updateBars();
    toast('保存しました。次回のチェックから反映されます');
  } catch (e) { toast(e.message); }
  btn.disabled = false; btn.textContent = 'キーワードを保存';
});

/* ---------- 株価 ---------- */
document.querySelectorAll('#seg button').forEach(b => b.addEventListener('click', () => {
  seg = b.dataset.seg;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  $('seg-alerts').hidden = seg !== 'alerts';
  $('seg-watch').hidden = seg !== 'watch';
  updateBars();
}));

function pct(v) {
  const n = Number(String(v).replace(/[,%+]/g, ''));
  if (v === '' || v == null || !isFinite(n)) return '';
  return (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
}
function yen(v) { if (v === '' || v == null) return ''; const n = Number(String(v).replace(/,/g, '')); return isFinite(n) ? n.toLocaleString('ja-JP') : String(v); }

function renderPc() {
  const t = Number((state.monitor || {}).lastBeat || 0);
  const on = t && (Date.now() - t) < 15 * 60000;
  $('pcDot').classList.toggle('on', !!on);
  if (!t) { $('pcText').textContent = 'PC監視：まだ接続されていません'; return; }
  const d = new Date(t);
  const hm = d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  const md = (d.getMonth() + 1) + '/' + d.getDate();
  $('pcText').textContent = on ? 'PC監視：稼働中（最終確認 ' + hm + '）' : 'PC監視：停止中（最終確認 ' + md + ' ' + hm + '）';
}

function renderPrice() {
  const list = state.priceHistory || [];
  if (!list.length) {
    $('priceList').innerHTML = '<div class="empty">まだ株価の通知はありません<br>「銘柄設定」で銘柄と条件を登録してください</div>';
    return;
  }
  $('priceList').innerHTML = list.map(h => {
    const cls = /急騰|上抜け/.test(h.kind) ? 'up' : /急落|下抜け/.test(h.kind) ? 'down' : '';
    const c = Number(h.chg);
    return `<div class="card">
      <div class="meta"><span class="kind ${cls}">${esc(h.kind)}</span><span class="code">${esc(h.code)}</span><span>${esc(h.name)}</span><span>${esc(h.notified)}</span></div>
      <div class="ttl">${esc(h.text)}</div>
      <div class="meta"><span>現在値 ${esc(yen(h.price))}円</span><span class="chg ${c > 0 ? 'up' : c < 0 ? 'down' : ''}">前日比 ${esc(pct(h.chg))}</span></div>
    </div>`;
  }).join('');
}

function condText(w) {
  const a = [];
  if (w.upPct || w.downPct) a.push('前日比 ' + [w.upPct ? '+' + w.upPct + '%' : '', w.downPct ? '−' + w.downPct + '%' : ''].filter(Boolean).join(' / '));
  if (w.shortMin && w.shortPct) a.push(w.shortMin + '分で±' + w.shortPct + '%');
  if (w.above) a.push(yen(w.above) + '円以上');
  if (w.below) a.push(yen(w.below) + '円以下');
  return a.length ? a.join('　・　') : '条件が未設定です（タップして設定）';
}

const W_FIELDS = [
  ['grp', '前日比（前日終値から）'],
  ['upPct', '上昇 ％', '例：8'], ['downPct', '下落 ％', '例：5'],
  ['grp', '短時間の変動'],
  ['shortMin', '何分間で', '例：5'], ['shortPct', '何％動いたら', '例：3'],
  ['grp', '価格'],
  ['above', '○円以上になったら', '例：3000'], ['below', '○円以下になったら', '例：2500'],
];
function renderWatch(openIdx) {
  const list = state.watch || [];
  if (!list.length) {
    $('watchList').innerHTML = '<div class="empty">登録銘柄がありません</div>';
    return;
  }
  $('watchList').innerHTML = list.map((w, i) => {
    let fields = '', pair = [];
    W_FIELDS.forEach(f => {
      if (f[0] === 'grp') { if (pair.length) fields += '<div class="grid2">' + pair.join('') + '</div>'; pair = []; fields += `<div class="grp">${f[1]}</div>`; return; }
      pair.push(`<div><label class="f">${f[1]}</label><input type="text" inputmode="decimal" data-w="${f[0]}" value="${esc(w[f[0]])}" placeholder="${f[2]}"></div>`);
    });
    if (pair.length) fields += '<div class="grid2">' + pair.join('') + '</div>';
    return `<div class="card${i === openIdx ? ' open' : ''}" data-i="${i}">
      <div class="row">
        <div class="grow w-sum" data-toggle="1">
          <div class="kw-head">${esc(w.code) || '（コード未入力）'} ${esc(w.name)}</div>
          <div class="cond">${esc(condText(w))}</div>
        </div>
        <label class="sw"><input type="checkbox" data-w="enabled" ${w.enabled ? 'checked' : ''}><span></span></label>
      </div>
      <div class="w-body">
        <div class="grid2">
          <div><label class="f">銘柄コード</label><input type="text" data-w="code" value="${esc(w.code)}" placeholder="例：7203" autocapitalize="characters"></div>
          <div><label class="f">銘柄名（任意）</label><input type="text" data-w="name" value="${esc(w.name)}" placeholder="空欄なら自動"></div>
        </div>
        ${fields}
        <label class="f">メモ</label><input type="text" data-w="memo" value="${esc(w.memo)}">
        <div class="row" style="justify-content:flex-end;margin-top:10px">
          <button class="btn danger" type="button" data-wdel="${i}">削除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function markWatchDirty() { watchDirty = true; updateBars(); }
$('watchList').addEventListener('click', e => {
  const del = e.target.closest('[data-wdel]');
  if (del) {
    const w = state.watch[+del.dataset.wdel];
    if (!confirm('「' + (w.code || '') + ' ' + (w.name || '') + '」を削除しますか？')) return;
    state.watch.splice(+del.dataset.wdel, 1);
    renderWatch(); markWatchDirty();
    return;
  }
  if (e.target.closest('[data-toggle]')) e.target.closest('.card').classList.toggle('open');
});
$('watchList').addEventListener('input', e => {
  const card = e.target.closest('.card'); const f = e.target.dataset.w;
  if (!card || !f) return;
  const w = state.watch[+card.dataset.i];
  w[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value.trim();
  card.querySelector('.kw-head').textContent = (w.code || '（コード未入力）') + ' ' + (w.name || '');
  card.querySelector('.cond').textContent = condText(w);
  markWatchDirty();
});
$('addWatch').addEventListener('click', () => {
  state.watch = state.watch || [];
  state.watch.push({ enabled: true, code: '', name: '', upPct: '', downPct: '', shortMin: '', shortPct: '', above: '', below: '', memo: '' });
  renderWatch(state.watch.length - 1); markWatchDirty();
  const inputs = $('watchList').querySelectorAll('input[data-w="code"]');
  inputs[inputs.length - 1].focus();
});
$('saveWatch').addEventListener('click', async () => {
  const bad = (state.watch || []).find(w => w.shortMin && !w.shortPct || !w.shortMin && w.shortPct);
  if (bad) { toast((bad.code || '') + '：短時間の変動は「何分間」と「何％」の両方を入れてください'); return; }
  const btn = $('saveWatch'); btn.disabled = true; btn.textContent = '保存中…';
  try {
    const j = await api('saveWatch', { watch: state.watch || [] });
    state = j.data; watchDirty = false;
    renderWatch(); updateBars();
    toast('保存しました。PCの監視には5分以内に反映されます');
  } catch (e) { toast(e.message); }
  btn.disabled = false; btn.textContent = '銘柄設定を保存';
});

/* ---------- 設定 ---------- */
function renderSettings() {
  $('setEnabled').checked = !!state.settings.enabled;
  $('setMail').checked = !!state.settings.mail;
  const p = state.push || {};
  const perm = ('Notification' in window) ? Notification.permission : 'unsupported';
  $('pushState').textContent = !p.ready ? 'Firebase未設定'
    : perm === 'granted' ? '登録端末 ' + p.devices + '台' : '未設定';
}
async function saveSetting(obj) {
  try { const j = await api('saveSettings', obj); state = j.data; renderSettings(); toast('変更しました'); }
  catch (e) { toast(e.message); renderSettings(); }
}
$('setEnabled').addEventListener('change', e => saveSetting({ enabled: e.target.checked }));
$('setMail').addEventListener('change', e => saveSetting({ mail: e.target.checked }));

$('gasUrl').value = store.get('gasUrl');
$('appKey').value = store.get('appKey');
$('saveConn').addEventListener('click', async () => {
  store.set('gasUrl', $('gasUrl').value.trim());
  store.set('appKey', $('appKey').value.trim());
  try {
    const j = await api('data'); state = j.data;
    renderKeywords(); renderWatch(); renderHistory(); renderPrice(); renderPc(); renderSettings();
    status($('connStatus'), '接続できました', true);
  } catch (e) { status($('connStatus'), e.message, false); }
});

/* ---------- プッシュ通知 ---------- */
let messaging = null;
async function getMessagingSafe() {
  if (messaging) return messaging;
  const { initializeApp, getMessaging, onMessage, isSupported } = await loadFirebase();
  if (!(await isSupported())) throw new Error('この環境ではプッシュ通知を使えません');
  const app = initializeApp(self.FIREBASE_CONFIG);
  messaging = getMessaging(app);
  onMessage(messaging, payload => {
    const n = payload.notification || {};
    toast((n.title || '新しい開示') + '\n' + (n.body || ''));
    load();
  });
  return messaging;
}

$('enablePush').addEventListener('click', async () => {
  const el = $('pushStatus');
  if (!isStandalone()) {
    status(el, 'Safariの共有ボタン →「ホーム画面に追加」をして、ホーム画面のアイコンから開いてから押してください', false);
    return;
  }
  if (!('Notification' in window) || !('serviceWorker' in navigator)) {
    status(el, 'この iPhone では通知を使えません（iOS 16.4以降が必要です）', false);
    return;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      status(el, '通知が許可されませんでした。iPhoneの「設定 → 通知 → 開示通知」で許可してください', false);
      return;
    }
    status(el, '登録中…', true);
    const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    const m = await getMessagingSafe();
    const { getToken } = await loadFirebase();
    const token = await getToken(m, { vapidKey: self.VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error('端末の登録に失敗しました');
    const appUrl = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
    const j = await api('registerToken', { token, appUrl });
    store.set('fcmToken', token);
    status(el, '通知をONにしました（登録端末 ' + j.devices + '台）', true);
    load();
  } catch (e) {
    status(el, e.message || String(e), false);
  }
});

$('testPush').addEventListener('click', async () => {
  const el = $('pushStatus');
  try {
    await api('testPush');
    status(el, 'テスト通知を送りました。数秒で届きます（アプリを閉じると通知欄に出ます）', true);
  } catch (e) { status(el, e.message, false); }
});

/* 通知を許可済みなら、起動のたびに端末登録を更新（トークンの入れ替わり対策） */
async function refreshToken() {
  try {
    if (!isStandalone() || !('Notification' in window) || Notification.permission !== 'granted') return;
    if (!store.get('gasUrl') || !store.get('appKey')) return;
    const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    const m = await getMessagingSafe();
    const { getToken } = await loadFirebase();
    const token = await getToken(m, { vapidKey: self.VAPID_KEY, serviceWorkerRegistration: reg });
    if (token && token !== store.get('fcmToken')) {
      await api('registerToken', { token, appUrl: location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '') });
      store.set('fcmToken', token);
    }
  } catch (e) { /* 失敗しても画面表示には影響させない */ }
}

/* ---------- 起動 ---------- */
$('reload').addEventListener('click', () => { kwDirty = false; watchDirty = false; updateBars(); load(); });
$('reload').addEventListener('dblclick', () => location.reload());
document.addEventListener('visibilitychange', () => { if (!document.hidden && !kwDirty && !watchDirty) load(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./firebase-messaging-sw.js').catch(() => {});
load();
setTimeout(refreshToken, 1500);
</script>
